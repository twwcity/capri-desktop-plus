<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: capri:; font-src 'self'; media-src 'self' capri: blob:; connect-src 'self' capri:">
  <title>Capri</title>
  <link rel="stylesheet" href="styles/capri.css">
</head>
<body>
  <div id="capri" class="capri">
    <canvas id="sprite" class="capri__sprite" aria-label="Capri"></canvas>
  </div>

  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <canvas id="chip" class="chip" hidden aria-label="Capri’s biochip"></canvas>
  <canvas id="mask" class="chip" hidden aria-label="Capri, asleep"></canvas>

  <!-- her hologram, warped like a signal being hacked (capri.css: .panel__face img) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="capri-warp" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.22" numOctaves="1" seed="2" result="noise">
        <animate attributeName="seed" values="2;9;4;13;7;21;3" dur="0.9s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" xChannelSelector="R" yChannelSelector="G" scale="5">
        <animate attributeName="scale" values="3;5;2;14;4;3;9;2" dur="2.3s" calcMode="discrete" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </svg>
  <aside id="panel" class="panel" data-kind="info" hidden aria-live="polite">
    <div class="panel__frame">
      <div class="panel__plate">
        <figure class="panel__face" aria-hidden="true">
          <img src="../../assets/capri/capri-face.png" alt="">
        </figure>
        <div class="panel__body">
          <header class="panel__meta">
            <span class="panel__who">Capri</span>
            <span class="panel__tag"></span>
            <button class="panel__history" type="button" title="Chat history" aria-label="Chat history"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
            <span class="panel__state"></span>
          </header>
          <p class="panel__line"></p>
          <p class="panel__quote" hidden></p>
          <div class="panel__progress" hidden><span class="panel__bar"></span></div>
          <div class="panel__reply" hidden></div>
          <figure class="panel__preview" hidden><img alt=""><figcaption><button class="panel__action" type="button" data-act="open">Open</button><button class="panel__action" type="button" data-act="show">Show in folder</button></figcaption></figure>
          <section class="panel__report" hidden></section>
          <p class="panel__summary" hidden></p>
          <ol class="panel__log" hidden></ol>
          <div class="panel__actions" hidden></div>
          <div class="panel__files" hidden></div>
          <form class="panel__chat" hidden autocomplete="off">
            <input class="panel__input" type="text" maxlength="500" spellcheck="false">
            <button class="panel__action panel__attach" type="button" title="Add a picture or file" aria-label="Add a picture or file"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="miter" d="M4 7l3-3h10l3 3v10l-3 3H7l-3-3z"/><path fill="currentColor" d="M11 7h2v4h4v2h-4v4h-2v-4H7v-2h4z"/><path fill="var(--accent)" d="M18.5 2.5h3v3h-3z"/></svg></button>
            <button class="panel__action panel__mic" type="button" title="Talk" aria-label="Talk" hidden><svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9 2h6l2 2v8l-2 2H9l-2-2V4zm1 3v1.4h4V5zm0 3v1.4h4V8z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="miter" d="M4.5 10.5v2.2l3.3 3.3h8.4l3.3-3.3v-2.2M12 16v4.2M8 21.2h8"/><path fill="var(--accent)" d="M18.5 2.5h3v3h-3z"/></svg></button>
            <button class="panel__action is-primary panel__send" type="submit"></button>
            <button class="panel__action panel__close" type="button">✕</button>
          </form>
          <p class="panel__note" hidden></p>
        </div>
      </div>
      <div class="panel__tail" aria-hidden="true"></div>
    </div>
  </aside>

  <div id="ticker" class="ticker" hidden>
    <div class="ticker__plate">
      <span class="ticker__dot" aria-hidden="true"></span>
      <span class="ticker__verb"></span>
      <span class="ticker__target"></span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
